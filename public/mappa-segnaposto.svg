<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Mappa segnaposto, non reale">
  <!-- MAPPA SEGNAPOSTO per sviluppo e screenshot. Vie e nomi inventati: non e' Bagnarola. -->
  <!-- In produzione l'app usa public/mappa-2026.webp fornita dall'organizzazione. -->
  <defs>
    <pattern id="campi" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <rect width="18" height="18" fill="#e6e0c8"/>
      <path d="M0 9h18" stroke="#d8d0b0" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="#efe9da"/>
  <rect x="0" y="0" width="1200" height="120" fill="url(#campi)"/>
  <rect x="0" y="780" width="1200" height="120" fill="url(#campi)"/>

  <!-- Isolati -->
  <g fill="#e2d8c2" stroke="#d3c6a8" stroke-width="2">
    <rect x="60" y="150" width="210" height="260" rx="10"/>
    <rect x="330" y="150" width="260" height="260" rx="10"/>
    <rect x="650" y="150" width="250" height="120" rx="10"/>
    <rect x="960" y="150" width="190" height="260" rx="10"/>
    <rect x="60" y="490" width="210" height="250" rx="10"/>
    <rect x="330" y="490" width="260" height="110" rx="10"/>
    <rect x="330" y="650" width="260" height="90" rx="10"/>
    <rect x="960" y="490" width="190" height="250" rx="10"/>
  </g>
  <!-- Edifici -->
  <g fill="#cdbf9f">
    <rect x="80" y="170" width="70" height="50" rx="3"/><rect x="170" y="170" width="80" height="60" rx="3"/>
    <rect x="80" y="250" width="60" height="60" rx="3"/><rect x="170" y="330" width="80" height="60" rx="3"/>
    <rect x="350" y="170" width="90" height="55" rx="3"/><rect x="470" y="170" width="100" height="70" rx="3"/>
    <rect x="350" y="320" width="70" height="70" rx="3"/><rect x="480" y="330" width="90" height="60" rx="3"/>
    <rect x="670" y="170" width="80" height="80" rx="3"/><rect x="780" y="170" width="100" height="60" rx="3"/>
    <rect x="980" y="170" width="70" height="60" rx="3"/><rect x="1070" y="180" width="60" height="80" rx="3"/>
    <rect x="980" y="320" width="150" height="70" rx="3"/>
    <rect x="80" y="510" width="80" height="60" rx="3"/><rect x="180" y="520" width="70" height="80" rx="3"/>
    <rect x="80" y="660" width="170" height="60" rx="3"/>
    <rect x="350" y="510" width="100" height="70" rx="3"/><rect x="470" y="510" width="100" height="70" rx="3"/>
    <rect x="350" y="665" width="220" height="60" rx="3"/>
    <rect x="980" y="510" width="70" height="90" rx="3"/><rect x="1070" y="510" width="60" height="60" rx="3"/>
    <rect x="990" y="650" width="140" height="70" rx="3"/>
  </g>

  <!-- Parco -->
  <rect x="650" y="490" width="250" height="250" rx="16" fill="#cfdab4" stroke="#b8c79a" stroke-width="2"/>
  <g fill="#a9bd85">
    <circle cx="700" cy="540" r="18"/><circle cx="760" cy="600" r="22"/><circle cx="840" cy="545" r="16"/>
    <circle cx="700" cy="680" r="20"/><circle cx="850" cy="690" r="18"/><circle cx="800" cy="660" r="14"/>
  </g>

  <!-- Canale -->
  <path d="M-20 820 C 200 760, 420 800, 620 760 S 1000 700, 1220 740" fill="none" stroke="#b7cbe0" stroke-width="30"/>

  <!-- Vie -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#d3c6a8" stroke-width="40">
      <path d="M0 450 H1200"/><path d="M300 120 V780"/><path d="M620 120 V780"/><path d="M930 120 V780"/>
      <path d="M620 300 H930"/><path d="M300 625 H620"/>
    </g>
    <g stroke="#fbf8f0" stroke-width="32">
      <path d="M0 450 H1200"/><path d="M300 120 V780"/><path d="M620 120 V780"/><path d="M930 120 V780"/>
      <path d="M620 300 H930"/><path d="M300 625 H620"/>
    </g>
  </g>

  <!-- Piazza e chiesa -->
  <circle cx="620" cy="450" r="46" fill="#fbf8f0" stroke="#d3c6a8" stroke-width="3"/>
  <rect x="700" y="365" width="60" height="44" rx="3" fill="#c2b08c"/>
  <path d="M730 372 v26 M720 382 h20" stroke="#fbf8f0" stroke-width="4"/>

  <!-- Percorso delle case -->
  <path d="M300 200 V450 H620 V300 H930 V620 M930 450 H1100 M300 450 V625 H620 V700"
        fill="none" stroke="#e8792b" stroke-width="6" stroke-dasharray="14 12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nomi delle vie (inventati) -->
  <g font-family="Georgia, serif" font-size="20" fill="#7a6c52" letter-spacing="1">
    <text x="60" y="440">VIA DEI LAMPIONI</text>
    <text x="1000" y="440">VIA DEI LAMPIONI</text>
    <text transform="translate(290 380) rotate(-90)">VIA DELLE ZUCCHE</text>
    <text transform="translate(920 740) rotate(-90)">VIA DEL MULINO</text>
    <text x="660" y="290">VIA DELLE STREGHE</text>
    <text x="340" y="615">VICOLO DEL CANALE</text>
    <text x="560" y="520">PIAZZA DELLA FESTA</text>
    <text x="700" y="800" font-style="italic">canale</text>
  </g>

  <!-- Cartiglio: dichiaratamente finta -->
  <g>
    <rect x="24" y="22" width="430" height="78" rx="8" fill="#fbf8f0" stroke="#c9542b" stroke-width="3"/>
    <text x="44" y="56" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#c9542b">MAPPA SEGNAPOSTO</text>
    <text x="44" y="84" font-family="Georgia, serif" font-size="17" fill="#7a6c52">Vie e nomi inventati · non e' Bagnarola</text>
  </g>
  <g transform="translate(1110 60)" fill="#7a6c52" font-family="Georgia, serif" font-size="22" text-anchor="middle">
    <path d="M0 -30 L12 10 L0 2 L-12 10 Z" fill="#7a6c52"/>
    <text y="36">N</text>
  </g>
</svg>
