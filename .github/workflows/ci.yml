name: ci
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

# Cancello di Alx Studio: i job devono essere verdi prima del merge (test e build obbligatori).
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./package-lock.json
      - run: npm ci
      - run: |
          if [ -f .env.example ] && [ ! -f .env ]; then cp .env.example .env; fi
          npm run build
      - run: npm run lint
        continue-on-error: true  # informativo finché il debito non è chiuso

  # Regole Firestore sull'emulatore: bloccante.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./package-lock.json
      - run: npm ci
      # firebase-tools non è tra le devDependencies (albero enorme): installato solo qui.
      - run: npm install -g firebase-tools@15.34.0
      - run: npm run test:rules
